plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

version = '2.0.0-1.21.1'
group = 'com.github.alexthe668'

base {
    archivesName = 'domesticationinnovation'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTest suite: mirrors the owner's proven OreSpawn setup (NeoGradle
// userdev there, translated to ModDevGradle here). Tests live in their
// own source set so test code and arena templates never ship in the mod
// jar; the source set is folded into the mod below so NeoForge's
// annotation scan finds @GameTestHolder classes, and the
// `neoforge.enabledGameTestNamespaces` system property opts this mod's
// namespace into the test discovery.
sourceSets {
    gametest {
        // Convention already maps src/gametest/java + src/gametest/resources.
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = '21.1.77'

    // Puts NeoForge/Minecraft on the gametest source set's classpaths
    // (MDG only wires sourceSets.main by default).
    addModdingDependenciesTo sourceSets.gametest

    runs {
        client {
            client()
            // Enables /test commands against this namespace in the dev client.
            systemProperty 'neoforge.enabledGameTestNamespaces', 'domesticationinnovation'
        }
        server {
            server()
        }
        // Headless CI-able suite runner: `gradlew runGameTestServer`
        // starts a GameTestServer, runs every enabled test, and exits
        // nonzero if any fail. (MDG 2.0.42-beta has no gameTestServer()
        // shorthand on RunModel — the type string is the documented way.)
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'domesticationinnovation'
        }
        data {
            data()
            programArguments.addAll '--mod', 'domesticationinnovation', '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        domesticationinnovation {
            sourceSet sourceSets.main
            // Gametest classes/templates load as part of the mod in dev
            // runs (annotation scan + data/domesticationinnovation/structure
            // templates); the jar task still packages only sourceSets.main.
            sourceSet sourceSets.gametest
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://maven.neoforged.net/releases"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // Citadel for NeoForge 1.21.1 - update artifact ID when available
    // If no NeoForge Citadel exists, the Citadel functionality has been inlined
    // compileOnly "curse.maven:citadel-331936:XXXXXXX"

    // Jade (optional): compile against it for the entity-overlay plugin in
    // compat/jade. Those classes are only ever classloaded by Jade's
    // @WailaPlugin annotation scan, so no runtime dependency results.
    compileOnly "maven.modrinth:jade:15.10.6+neoforge"
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "domesticationinnovation",
            "Specification-Vendor"    : "alexthe668",
            "Specification-Version"   : "2.0",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : version,
            "Implementation-Vendor"   : "alexthe668",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
